<div class="showcase-shelf">
    {% if object.shelf.title %}
        <div class="title-showcase">
            <h2 class="title">{{ object.shelf.title }} </h2>
            {% if object.shelf.sub_title %}
                <h3 class="sub-title">{{ object.shelf.sub_title }}</h3>
            {% endif %}
        </div>
    {% endif %}
    <div class="list-products{% if object.extra_data and object.extra_data.scroll == 'true' %} horizontal-scroll{% else %} default{% endif %}">
        {% for product in object.shelf.get_products %}
            {% ifchanged product.product_id %}
                {% include "shop/includes/product.html" %}
            {% endifchanged %}
        {% endfor %}
    </div>
</div>
